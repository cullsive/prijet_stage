<div class="chart">
    <svg viewBox="0 0 400 200" class="chart-svg">

        <!-- Axes -->
        <line x1="20" y1="180" x2="380" y2="180" class="axis" />
        <line x1="40" y1="20" x2="40" y2="180" class="axis" />

        <!-- Dégradés animés -->
        <defs>
            <!-- Vert Binance -->
            <linearGradient id="gradGreen">
                <stop offset="0%" stop-color="#4ade80">
                    <animate attributeName="stop-color" values="#4ade80; #22c55e; #4ade80" dur="4s" repeatCount="indefinite"/>
                </stop>
                <stop offset="100%" stop-color="#22c55e">
                    <animate attributeName="stop-color" values="#22c55e; #4ade80; #22c55e" dur="4s" repeatCount="indefinite"/>
                </stop>
            </linearGradient>

            <!-- Bleu TradingView -->
            <linearGradient id="gradBlue">
                <stop offset="0%" stop-color="#3b82f6">
                    <animate attributeName="stop-color" values="#3b82f6; #2563eb; #3b82f6" dur="4s" repeatCount="indefinite"/>
                </stop>
                <stop offset="100%" stop-color="#2563eb">
                    <animate attributeName="stop-color" values="#2563eb; #3b82f6; #2563eb" dur="4s" repeatCount="indefinite"/>
                </stop>
            </linearGradient>

            <!-- Jaune Binance -->
            <linearGradient id="gradYellow">
                <stop offset="0%" stop-color="#facc15">
                    <animate attributeName="stop-color" values="#facc15; #eab308; #facc15" dur="4s" repeatCount="indefinite"/>
                </stop>
                <stop offset="100%" stop-color="#eab308">
                    <animate attributeName="stop-color" values="#eab308; #facc15; #eab308" dur="4s" repeatCount="indefinite"/>
                </stop>
            </linearGradient>

            <!-- Remplissage -->
            <linearGradient id="fillGreen" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="rgba(74,222,128,0.4)" />
                <stop offset="100%" stop-color="rgba(74,222,128,0)" />
            </linearGradient>

            <linearGradient id="fillBlue" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="rgba(59,130,246,0.4)" />
                <stop offset="100%" stop-color="rgba(59,130,246,0)" />
            </linearGradient>

            <linearGradient id="fillYellow" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="rgba(250,204,21,0.4)" />
                <stop offset="100%" stop-color="rgba(250,204,21,0)" />
            </linearGradient>
        </defs>

        <!-- Remplissage courbe verte -->
